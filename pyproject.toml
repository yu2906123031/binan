[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [
  ".hermes",
  ".git",
  "__pycache__",
  ".venv-typecheck",
]

[tool.ruff.lint]
select = ["E9", "F", "B023", "B904"]
ignore = []

[tool.mypy]
python_version = "3.11"
files = [
  "scripts/binance_momentum_supervisor.py",
  "scripts/binance_runtime_ctl.py",
  "scripts/candidate_builder.py",
  "scripts/execution_engine.py",
  "scripts/runtime_store.py",
  "scripts/runtime_store_impl.py",
  "scripts/trade_bucket_analysis.py",
  "scripts/summary_render.py",
  "scripts/risk_state_helpers.py",
  "scripts/runtime_state_risk_helpers.py",
  "scripts/hermes_outer_watcher.py",
  "scripts/market_direction_bias.py",
  "scripts/selection_quality_policy.py",
  "scripts/relative_selection_policy.py",
  "scripts/selection_diversification_policy.py",
  "scripts/selection_stability_policy.py",
  "scripts/selection_outcome_policy.py",
  "scripts/layer_attribution.py",
  "scripts/runtime_state_backup_hardening.py",
  "scripts/execution_feedback_hardening.py",
  "scripts/trade_bucket_slippage_hardening.py",
  "scripts/trade_bucket_analysis_cli.py",
  "scripts/slippage_calibration_policy.py",
  "scripts/slippage_cache_staleness_hardening.py",
  "scripts/lifecycle_snapshot.py",
  "scripts/risk_exit_guard.py",
  "scripts/rest_guard_retry_after_hardening.py",
  "scripts/request_throttle_hardening.py",
  "scripts/startup_bootstrap.py",
  "tests/test_layer_attribution.py",
  "tests/test_execution_module_regression.py",
  "tests/test_strategy_v2_restore_regression.py",
  "tests_support/strategy_v2_restore_regression_impl.py",
  "tests/test_cli_args.py",
  "tests/test_run_loop_smoke.py",
  "tests/test_scan_summary_mode_regression.py",
  "tests/test_strategy_v2.py",
  "tests/test_hermes_outer_watcher.py",
]
warn_unused_configs = true
show_error_codes = true
pretty = true

# These preserved implementations are regression-locked behind canonical
# wrappers.  Their bodies retain legacy dynamic dictionaries/iterator shapes;
# do not follow those bodies during canonical API checking.  No error-code
# exemptions are used anywhere in the project.
[[tool.mypy.overrides]]
module = ["execution_engine_impl", "trade_bucket_analysis_impl"]
follow_imports = "skip"
