name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - run: python -m pip install -r requirements-ci.lock
      - run: python -m compileall -q main.py scripts tests tests_support
      - run: python -m ruff check main.py scripts tests tests_support
      - run: python -m mypy
      - run: python -m pytest -q -rs
